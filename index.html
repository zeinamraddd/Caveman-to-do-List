<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>My To-Do List</h1>
        <p class="intro">A little list to keep my day organized.</p>

        <form id="task-form">
            <label for="task-input">New task</label>
            <div class="input-row">
                <input id="task-input" type="text" placeholder="What do you need to do?" aria-describedby="message" autocomplete="off">
                <button type="submit">Add task</button>
            </div>
        </form>
        <p id="message" role="status"></p>
        <p id="storage-message" role="status"></p>

        <h2>My tasks</h2>
        <p class="hint">Use Done to complete a task, or Undo to change it back.</p>
        <p id="counter" aria-live="polite"></p>
        <ul id="task-list"></ul>
        <p id="empty-message">No tasks yet. Add your first one above!</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
